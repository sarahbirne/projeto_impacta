<text x="890" y="209" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#444" text-anchor="start" font-weight="normal" font-style="normal">  como parte do caso base.</text>
<text x="890" y="224" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#444" text-anchor="start" font-weight="normal" font-style="normal">• «extend»: executado apenas em</text>
<text x="890" y="239" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#444" text-anchor="start" font-weight="normal" font-style="normal">  certas condições — comparar só</text>
