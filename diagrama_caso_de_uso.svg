<text x="890" y="269" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#444" text-anchor="start" font-weight="normal" font-style="normal">  codificar temas só quando há</text>
<text x="890" y="284" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="10.5" fill="#444" text-anchor="start" font-weight="normal" font-style="normal">  respostas abertas preenchidas.</text>
